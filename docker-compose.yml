version: "3.8"

services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    env_file:
      - .env 
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - app-network
  
  db-webui:
    image: dpage/pgadmin4
    container_name: pgadmin_db
    ports:
      - "5050:80"
    networks:
      - app-network
    env_file:
      - .env
    volumes:
      - pgadmin-data:/var/lib/pgadmin


networks:
  app-network:

volumes:
  db-data:
  pgadmin-data:



